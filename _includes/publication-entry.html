<div class="list__item">
  <article class="archive__item" itemscope itemtype="https://schema.org/ScholarlyArticle">
    <h3 class="archive__item-title" itemprop="headline"><a href="{{ post.url | relative_url }}">[{{ include.number }}] {{ post.title | escape }}</a></h3>
    <p>{{ post.authors }}</p>
    <p>{{ post.journal }} {{ post.publication_date }}<br>
    <a href="{{ post.paperurl }}">DOI: {{ post.doi }}</a></p>
  </article>
</div>
